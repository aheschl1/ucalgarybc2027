# On a cpython-N tag (`make tag KIND=cpython`): builds CPython for WASI (`make cpython`:
# pymalloc, LTO, the wasm features wasmtime has) and publishes the build and stdlib zips as
# a release at the tag, which `make guest` downloads: the Makefile pins the release and
# both checksums, printed in this run's summary.
name: CPython

on:
  push:
    tags: ['cpython-*']

permissions:
  contents: write

jobs:
  cpython:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.14.7
      - run: make cpython
      - run: sha256sum .cache/build/python-build.zip .cache/build/python.zip | tee -a "$GITHUB_STEP_SUMMARY"
      - run: gh release create ${{ github.ref_name }} .cache/build/python-build.zip .cache/build/python.zip --title ${{ github.ref_name }} --notes "CPython for WASI built by make cpython at ${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
