# On a guest-N tag (`make tag KIND=guest`): builds the bot interpreter (ucbc-wasm/guest)
# and the stdlib zip and publishes them as a release at the tag, which `make build`
# downloads: the Makefile pins the release and both checksums, printed in this run's
# summary.
name: Guest

on:
  push:
    tags: ['guest-*']

permissions:
  contents: write

jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      # Only until the Makefile pins a CPython release: `make guest` then builds it here.
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.14.7
      - run: make guest
      - run: sha256sum .cache/guest.wasm .cache/stdlib.zip | tee -a "$GITHUB_STEP_SUMMARY"
      - run: gh release create ${{ github.ref_name }} .cache/guest.wasm .cache/stdlib.zip --title ${{ github.ref_name }} --notes "Bot interpreter and stdlib built from ${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
