# Builds the bot interpreter (ucbc-wasm/guest) and the stdlib zip and publishes them as a
# release, which `make dev` downloads: the Makefile pins the release and both checksums,
# printed in this run's summary. Runs when the guest changes; run it by hand after a
# CPython bump in the Makefile.
name: Guest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [ucbc-wasm/guest/**, .github/workflows/guest.yml]

permissions:
  contents: write

jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      # Only until the Makefile pins a CPython release: `make guest` then builds it here.
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.14.7
      - run: make guest
      - run: sha256sum .cache/guest.wasm .cache/stdlib.zip | tee -a "$GITHUB_STEP_SUMMARY"
      - run: gh release create guest-${{ github.run_number }} .cache/guest.wasm .cache/stdlib.zip --title "guest-${{ github.run_number }}" --notes "Bot interpreter and stdlib built from ${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
