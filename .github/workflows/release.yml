# On a v* tag (`make tag`): builds the wheels, runs release-check (the installed wheel plays
# a match in clean containers), uploads them to PyPI and attaches them to a GitHub release
# at the tag. PYPI_API_TOKEN is a repository secret.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10.2.0
      - run: make release-check
      - run: uv publish dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      - run: gh release create ${{ github.ref_name }} dist/* --title ${{ github.ref_name }} --notes "ucbc ${{ github.ref_name }}, on PyPI"
        env:
          GH_TOKEN: ${{ github.token }}
