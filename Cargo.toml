[workspace]
resolver = "3"
members = [
    "ucbc-engine",
    "ucbc-tictactoe",
    "ucbc-py",
    "ucbc-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/aheschl1/ucalgarybc2027"

[workspace.dependencies]
# Shared dependency versions. Crates opt in with `dep = { workspace = true }`.
ucbc-engine = { path = "ucbc-engine" }
ucbc-tictactoe = { path = "ucbc-tictactoe" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
pyo3 = "0.29"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
