[workspace]
resolver = "3"
members = [
    "ucbc-engine",
    "ucbc-games",
    "ucbc-cli",
    "ucbc-dev",
    "ucbc-wasm",
]

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/aheschl1/ucalgarybc2027"

[workspace.dependencies]
# Shared dependency versions. Crates opt in with `dep = { workspace = true }`.
ucbc-engine = { path = "ucbc-engine" }
ucbc-games = { path = "ucbc-games", default-features = false }
ucbc-wasm = { path = "ucbc-wasm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"
serde-pickle = "1.2"
thiserror = "2"
rand = "0.10"
rand_chacha = "0.10"
clap = { version = "4.5", features = ["derive"] }
pyo3 = "0.29"
schemars = { version = "1.2", features = ["derive"] }
wasmtime = { version = "49", default-features = false, features = ["runtime", "cranelift", "async", "parallel-compilation", "std"] }
wasmtime-wasi = "49"
wasmtime-wizer = "49"
pollster = "0.4"
tempfile = "3"
prost = "0.14"
prost-build = "0.14"
protox = "0.9"
base64 = "0.22"
flate2 = "1"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# `release` is what `make build` and the tests run on; link-time optimization would put
# two minutes on every edit. `dist` is the published wheel.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
