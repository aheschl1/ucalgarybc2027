[workspace]
resolver = "3"
members = [
    "ucbc-engine",
    "ucbc-games",
    "ucbc-py",
    "ucbc-dev",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
repository = "https://github.com/aheschl1/ucalgarybc2027"

[workspace.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }
seccompiler = { version = "0.5", features = ["json"] }
# Shared dependency versions. Crates opt in with `dep = { workspace = true }`.
ucbc-engine = { path = "ucbc-engine" }
ucbc-games = { path = "ucbc-games", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.10"
rand_chacha = "0.10"
clap = { version = "4.5", features = ["derive"] }
pyo3 = "0.29"
schemars = { version = "1.2", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
