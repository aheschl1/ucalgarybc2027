# Run through `make up` / `make db`, which pass .env and .env.<ENV> for ${...} substitution.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 2s
      timeout: 2s
      retries: 15

  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - blobdata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 15

  # The API and the web app; migrates first. `make up GAME=...` narrows the web app's viewer.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        UCBC_GAME: ${UCBC_GAME:-}
    env_file:
      - .env
      - .env.${ENV:-local}
    environment:
      ENV: ${ENV:-local}
      # Inside the compose network the database is `db`, not localhost.
      UCBC_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_USER}
      UCBC_BLOB_URL: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000/ucbc
      UCBC_API_HOST: 0.0.0.0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: sh -c "alembic upgrade head && ucbc-api"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Plays queued matches. Waits for the API so the schema is migrated. Bot directories named
  # in a queued match resolve under /app, where the checkout's bots/ is mounted.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
      - .env.${ENV:-local}
    environment:
      ENV: ${ENV:-local}
      UCBC_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_USER}
      UCBC_BLOB_URL: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000/ucbc
      UCBC_WORKER_SLOTS: ${UCBC_WORKER_SLOTS:-2}
    volumes:
      - ./bots:/app/bots:ro
    depends_on:
      api:
        condition: service_healthy
    # SIGTERM lets running matches finish.
    stop_grace_period: 10m

volumes:
  pgdata:
  blobdata:
