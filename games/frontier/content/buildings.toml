# Every building: what it costs, how much work finishes it, and its behaviours.
# `upgrades` names the building it improves on; a building's tier is its place on that line.
# Only `known` buildings are known at the start; a team learns another once it has
# studied every item in `cost`.

# A team starts with one; only its commander rebuilds it, and only once it's destroyed.
