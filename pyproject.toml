# Workspace root. `pip install ucbc` is the `ucbc-py` distribution: the extension,
# runtime, and CLI, which depends on `ucbc-sdk`, the pure `ucbc` package bots import.

[tool.uv.workspace]
members = ["ucbc-sdk", "ucbc-py", "ucbc-api", "ucbc-worker"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "testcontainers[postgres]>=4.8", "maturin>=1.9,<2", "ruff>=0.6", "mypy>=1.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["bots/tictactoe/testing/syntax_error"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["api", "worker"]

[tool.ruff.format]
exclude = ["**/_api.py"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["ucbc-sdk", "ucbc-py/python", "ucbc-api", "ucbc-worker", "alembic", "tests", "bots"]
exclude = ["bots/tictactoe/testing/syntax_error"]
mypy_path = "ucbc-sdk:ucbc-py/python:ucbc-api:ucbc-worker"
explicit_package_bases = true
