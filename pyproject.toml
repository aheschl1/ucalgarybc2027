# Workspace root. `pip install ucbc` is the `ucbc-py` distribution: the extension,
# runtime, and CLI, which depends on `ucbc-sdk`, the pure `ucbc` package bots import.

[tool.uv.workspace]
members = ["ucbc-sdk", "ucbc-py"]

[dependency-groups]
dev = ["pytest>=8", "maturin>=1.9,<2", "ruff>=0.6", "mypy>=1.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["bots/tictactoe/testing/syntax_error"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
exclude = ["**/_api.py"]

[tool.mypy]
strict = true
files = ["ucbc-sdk", "ucbc-py/python", "tests", "bots"]
exclude = ["bots/tictactoe/testing/syntax_error"]
mypy_path = "ucbc-sdk:ucbc-py/python"
explicit_package_bases = true
