[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "ucbc"
version = "0.1.0"
description = "UCalgary Battlecode: match engine, bot API, and CLI"
requires-python = ">=3.12"
dependencies = ["click>=8.1"]

[project.scripts]
ucbc = "ucbc.cli:main"

[tool.maturin]
manifest-path = "ucbc-py/Cargo.toml"
python-source = "ucbc-sdk"
module-name = "ucbc._engine"

[dependency-groups]
dev = ["pytest>=8", "maturin>=1.9,<2", "ruff>=0.6", "mypy>=1.13"]

[tool.pytest.ini_options]
testpaths = ["ucbc-sdk/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["bots/tictactoe/testing/syntax_error"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
exclude = ["**/_api.py"]

[tool.mypy]
strict = true
files = ["ucbc-sdk", "bots"]
exclude = ["bots/tictactoe/testing/syntax_error"]
mypy_path = "ucbc-sdk"
explicit_package_bases = true
