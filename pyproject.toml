# Workspace root. `pip install ucbc` is `ucbc-cli`: the package bots import, the engine
# extension, the bot runtime, and the CLI.

[tool.uv.workspace]
members = ["ucbc-cli", "ucbc-api", "ucbc-worker"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "testcontainers[minio,postgres]>=4.8",
    "maturin[zig]>=1.9,<2",
    "ruff>=0.6",
    "mypy>=1.13",
    "boto3-stubs[s3]>=1.35",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["bots/tictactoe/testing/syntax_error", "ucbc-cli/python/ucbc/runtime"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["api", "worker"]

[tool.ruff.format]
exclude = ["**/_api.py"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["ucbc-cli/python", "ucbc-api", "ucbc-worker", "alembic", "tests", "bots"]
exclude = ["bots/tictactoe/testing/syntax_error", "ucbc-cli/python/ucbc/runtime"]
mypy_path = "ucbc-cli/python:ucbc-api:ucbc-worker"
explicit_package_bases = true
