syntax = "proto3";

package proto.v1;

enum EntityType {
  BOT = 0;
}

message Vec2 {
  float x = 1;
  float y = 2;
}

message Entity {
  uint32 id = 1;
  Vec2 position = 2;
  EntityType entity_type = 3;
}

message EntityState {
  Vec2 delta = 1;
}

message GameState {
  repeated Entity entities = 1;
  uint64 tick = 2;
}