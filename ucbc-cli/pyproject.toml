[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "ucbc"
version = "0.1.9"
description = "UCalgary Battlecode: the package bots import, the match engine, and the ucbc command"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]
dependencies = ["click>=8.1"]

[project.urls]
Homepage = "https://ucbc.andrewheschl.ca"

[project.scripts]
ucbc = "ucbc.cli:main"

[tool.maturin]
python-source = "python"
module-name = "ucbc._engine"
exclude = ["**/__pycache__/**"]
