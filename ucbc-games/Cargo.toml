[package]
name = "ucbc-games"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "Every game the engine can be built with, and which ones a build includes"

# One feature per game, named as the game. `default` is what a build includes; `all` is for
# the tests and for tooling that covers every game, like SDK and viewer-type generation.
[features]
default = ["ucbc2027"]
all = ["tictactoe", "ucbc2027", "pacman", "frontier"]
tictactoe = ["dep:ucbc-tictactoe"]
ucbc2027 = ["dep:ucbc-2027"]
pacman = ["dep:ucbc-pacman"]
frontier = ["dep:ucbc-frontier"]

[dependencies]
ucbc-engine = { workspace = true }
ucbc-tictactoe = { path = "../games/tictactoe", optional = true }
ucbc-2027 = { path = "../games/ucbc2027", optional = true }
ucbc-pacman = { path = "../games/pacman", optional = true }
ucbc-frontier = { path = "../games/frontier", optional = true }

[lints]
workspace = true
