[package]
name = "ucbc-py"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "PyO3 extension module `ucbc_engine._engine`"

[lib]
name = "_engine"
crate-type = ["cdylib"]
test = false
doctest = false
bench = false

[features]
# The games compiled in: ucbc-games' default, or others with `--no-default-features
# -F ucbc-games/<game>` (the Makefile's GAMES).
default = ["ucbc-games/default"]

[dependencies]
# abi3: one wheel per platform serves every Python from 3.12 on.
pyo3 = { workspace = true, features = ["extension-module", "abi3-py312"] }
ucbc-engine = { workspace = true }
ucbc-games = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
nix = { workspace = true }
seccompiler = { workspace = true }

[lints]
workspace = true
