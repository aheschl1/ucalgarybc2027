[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "ucbc"
version = "0.1.1"
description = "UCalgary Battlecode: match engine, bot runtime, and the ucbc command; brings the bot SDK"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]
# The SDK is generated from this engine, so the two release in lockstep.
dependencies = ["ucbc-sdk==0.1.1", "click>=8.1"]

[project.urls]
Homepage = "https://ucbc.andrewheschl.ca"

[project.scripts]
ucbc = "ucbc_engine.cli:main"

[tool.maturin]
python-source = "python"
module-name = "ucbc_engine._engine"
exclude = ["**/__pycache__/**"]

[tool.uv.sources]
ucbc-sdk = { workspace = true }
