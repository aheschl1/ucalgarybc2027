[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "ucbc"
version = "0.1.0"
description = "UCalgary Battlecode: match engine, bot runtime, and the ucbc command; brings the bot SDK"
requires-python = ">=3.12"
dependencies = ["ucbc-sdk", "click>=8.1"]

[project.scripts]
ucbc = "ucbc_engine.cli:main"

[tool.maturin]
python-source = "python"
module-name = "ucbc_engine._engine"

[tool.uv.sources]
ucbc-sdk = { workspace = true }
