[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "ucbc-rl"
version = "0.1.11"
description = "UCalgary Battlecode: training environments for RL"
requires-python = ">=3.12"
# Its bot runtime runs Python opponents.
dependencies = ["ucbc"]

[tool.uv.sources]
ucbc = { workspace = true }

[tool.maturin]
python-source = "python"
module-name = "ucbc_rl._native"
features = ["python"]
exclude = ["**/__pycache__/**"]
