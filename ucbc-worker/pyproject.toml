[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[project]
name = "ucbc-worker"
version = "0.1.0"
description = "UCalgary Battlecode: plays queued matches and records them"
requires-python = ">=3.12"
dependencies = ["ucbc-api", "ucbc", "click>=8.1"]

[project.scripts]
ucbc-worker = "worker.main:main"

[tool.uv.sources]
ucbc-api = { workspace = true }
ucbc = { workspace = true }

[tool.uv.build-backend]
module-name = "worker"
module-root = ""
